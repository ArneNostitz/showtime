name: yamtrack-dev

services:
  yamtrack:
    build: .
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=Europe/Berlin
      - SECRET=longstring
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./db:/yamtrack/db
    ports:
      - "8001:8000"

  redis:
    container_name: yamtrack-dev-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_dev_data:/data

volumes:
  redis_dev_data:
